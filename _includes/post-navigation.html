<nav class="site-nav post-site-nav" aria-label="Blog navigation">
  <span class="post-site-nav-slot post-site-nav-previous">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← Previous</a>{% else %}<span aria-disabled="true">← Previous</span>{% endif %}
  </span>
  <span class="post-site-nav-slot post-site-nav-index">
    <a href="{{ '/blog/' | relative_url }}">Blog</a>
  </span>
  <span class="post-site-nav-slot post-site-nav-next">
    {% if page.next %}<a href="{{ page.next.url | relative_url }}">Next →</a>{% else %}<span aria-disabled="true">Next →</span>{% endif %}
  </span>
</nav>

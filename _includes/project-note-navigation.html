{%- comment -%}
  Navigation bar for a note that belongs to a project (front matter `project_key`):
  ← Back to project | Home
{%- endcomment -%}
{% include project-home.html %}

<nav class="site-nav project-section-site-nav" aria-label="Project note navigation">
  <span class="project-section-nav-slot project-section-nav-previous">
    {% if project_home %}
      <a href="{{ project_home.url | relative_url }}">← Back to project</a>
    {% else %}
      <a href="{{ '/projects/' | relative_url }}">← Back to projects</a>
    {% endif %}
  </span>

  <span class="project-section-nav-slot project-section-nav-home">
    <a href="{{ '/' | relative_url }}">Home</a>
  </span>

  <span class="project-section-nav-slot project-section-nav-next"></span>
</nav>

title: Robin Dueck Degen
description: Mathematics, projects, and project notes.
url: "https://robindueckdegen.com"
baseurl: ""
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
permalink: /blog/:year/:month/:day/:title/
timezone: America/Regina

collections:
  notes:
    output: true
    permalink: /notes/:path/
  project_chapters:
    output: true
    permalink: /projects/:path/
  project_sections:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      blog_area: true
  - scope:
      path: ""
      type: notes
    values:
      layout: post
      noindex: true
  - scope:
      path: ""
      type: project_chapters
    values:
      layout: project-chapter
      project_styles: true
  - scope:
      path: ""
      type: project_sections
    values:
      layout: project-section
      project_styles: true

include:
  - _redirects

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

github_url: ""

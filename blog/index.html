---
layout: default
title: Blog
content_class: section-index-page
blog_styles: true
---

<section class="section-index blog-index">
  <header class="section-index-header">
    <h1>Blog</h1>
  </header>
  <ul class="post-list">
    {% for post in site.posts %}
      <li class="post-list-item">
        <time class="post-list-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %B %Y" }}</time>
        <div>
          <h2 class="post-list-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
          {% if post.description %}<p class="post-list-description">{{ post.description }}</p>{% endif %}
        </div>
      </li>
    {% endfor %}
  </ul>
</section>

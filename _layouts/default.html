<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.blog_styles or page.layout == "post" %}
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  {% endif %}
  {% if page.project_styles or page.layout == "project" %}
  <link rel="stylesheet" href="{{ '/assets/css/project.css' | relative_url }}">
  {% endif %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
</head>
<body>
  <div class="site-shell">
    <div class="utility-strip">mathematics · projects · notes</div>

    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">Robin Dueck Degen</a>
      <p class="site-tagline">mathematics · University of Saskatchewan</p>
      {% include navigation.html %}
    </header>

    <main class="page-content{% if page.layout == 'home' %} home-page{% elsif page.layout == 'post' %} blog-post-page{% elsif page.layout == 'project' %} project-page{% elsif page.content_class %} {{ page.content_class }}{% endif %}">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>
</body>
</html>
